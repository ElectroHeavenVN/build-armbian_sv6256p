#==========================================================================
# Description: Compile armbian_sv6256p against mainline stable kernel
#==========================================================================

name: Compile SV6256P mainline stable kernel module

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source owner"
        required: false
        default: "ophub"
        type: choice
        options:
          - ophub
          - unifreq
      kernel_version:
        description: "Kernel branch"
        required: false
        default: "6.18.y"
        type: choice
        options:
          - 6.18.y
      kernel_ref:
        description: "Optional fixed commit/tag (leave empty to use latest main)"
        required: false
        default: ""
        type: string
      module_repo:
        description: "SV6256P module repository"
        required: false
        default: "cdhigh/armbian_sv6256p"
        type: string
      module_ref:
        description: "SV6256P branch/tag/commit"
        required: false
        default: "main"
        type: string
      ccache_clear:
        description: "Clear ccache"
        required: false
        default: false
        type: boolean

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6

      - name: Initialize build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
          sudo apt-get -y install jq rsync ccache git bc bison flex libssl-dev libelf-dev
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Resolve kernel source hash
        id: kernelhash
        run: |
          api_url="https://api.github.com/repos/${{ inputs.kernel_source }}/linux-${{ inputs.kernel_version }}/git/ref/heads/main"
          source_hash=$(curl -fsSL -m 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${api_url}" | jq -r '.object.sha')

          [[ -z "${source_hash}" || "${source_hash}" == "null" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> "${GITHUB_ENV}"
          echo "status=success" >> "${GITHUB_OUTPUT}"

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /builder/ccache
          key: sv6256p-${{ inputs.kernel_source }}-${{ inputs.kernel_version }}-${{ env.source_hash }}-${{ inputs.module_ref }}
          restore-keys: |
            sv6256p-${{ inputs.kernel_source }}-${{ inputs.kernel_version }}-

      - name: Clone kernel and module repositories
        if: ${{ steps.disk.outputs.status == 'success' && !cancelled() }}
        run: |
          set -e
          mkdir -p /builder/work
          cd /builder/work

          # Clone kernel repo giống compile-mainline-stable-kernel.yml (nguồn GitHub)
          git clone --depth=1 "https://github.com/${{ inputs.kernel_source }}/linux-${{ inputs.kernel_version }}.git" kernel-src
          cd kernel-src

          # Nếu người dùng muốn khóa đúng commit/tag (ví dụ v6.18.48) thì checkout tại đây
          if [[ -n "${{ inputs.kernel_ref }}" ]]; then
            git fetch --tags --force
            git checkout "${{ inputs.kernel_ref }}"
          fi

          cd /builder/work
          git clone --depth=1 --branch "${{ inputs.module_ref }}" "https://github.com/${{ inputs.module_repo }}.git" sv6256p-src

      - name: Build SV6256P module
        id: build
        if: ${{ !cancelled() }}
        run: |
          set -e
          export ARCH=arm64
          export LOCALVERSION=
          export KCFLAGS="-Wno-error"

          KDIR=/builder/work/kernel-src
          KOUT=/builder/work/kernel-out
          MODDIR=/builder/work/sv6256p-src

          mkdir -p "${KOUT}"

          # 1) Prepare out-of-tree kernel build dir
          make -C "${KDIR}" O="${KOUT}" ARCH="${ARCH}" defconfig
          make -C "${KDIR}" O="${KOUT}" ARCH="${ARCH}" modules_prepare

          # 2) Derive exact kernel release string from prepared tree
          KREL=$(make -s -C "${KDIR}" O="${KOUT}" ARCH="${ARCH}" kernelrelease)
          echo "Kernel release: ${KREL}"

          # 3) Build external module
          # NOTE: dùng KBUILD_MODPOST_WARN=1 để không fail cứng khi upstream driver cũ
          make -C "${KDIR}" O="${KOUT}" ARCH="${ARCH}" \
            M="${MODDIR}" \
            KERNELRELEASE="${KREL}" \
            KBUILD_MODPOST_WARN=1 \
            modules -j"$(nproc)"

          mkdir -p /builder/out
          find "${MODDIR}" -type f -name "*.ko" -print -exec cp -v {} /builder/out/ \;

          # metadata
          cd "${KDIR}"
          KERNEL_COMMIT=$(git rev-parse HEAD)
          cat > /builder/out/build-info.txt <<EOF
          kernel_repo=https://github.com/${{ inputs.kernel_source }}/linux-${{ inputs.kernel_version }}
          kernel_commit=${KERNEL_COMMIT}
          kernel_release=${KREL}
          module_repo=https://github.com/${{ inputs.module_repo }}
          module_ref=${{ inputs.module_ref }}
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

          echo "packaged_status=success" >> "${GITHUB_ENV}"
          echo "packaged_outputpath=/builder/out" >> "${GITHUB_ENV}"
          echo "status=success" >> "${GITHUB_OUTPUT}"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sv6256p-${{ inputs.kernel_version }}
          path: /builder/out/*
